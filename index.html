<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>مدرب الشطرنج الذكي</title>
  
  <!-- مكتبة قواعد الشطرنج مع رابطين احتياطيين لضمان العمل 100% -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script>
    if (typeof Chess === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"><\/script>');
    }
  </script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      margin: 0;
      padding: 8px;
      background: #0f1115;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .top-bar {
      width: 100%;
      max-width: 420px;
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .btn-side {
      flex: 1;
      padding: 9px;
      border-radius: 8px;
      border: 2px solid #2d333f;
      background: #181b22;
      color: #9ca3af;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-side.active {
      border-color: #10b981;
      background: #064e3b;
      color: #fff;
    }
    .mode-select {
      background: #181b22;
      color: #fff;
      border: 2px solid #2d333f;
      border-radius: 8px;
      padding: 0 8px;
      font-size: 12px;
      font-weight: bold;
    }

    .hud-box {
      width: 100%;
      max-width: 420px;
      background: #181b22;
      border: 1px solid #2d333f;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .turn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .my-turn { color: #10b981; }
    .opp-turn { color: #f59e0b; }

    .advice-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #065f46;
      color: #a7f3d0;
    }
    .badge.inacc { background: #78350f; color: #fde68a; }

    .timer-wrap {
      background: #0f1115;
      border-radius: 6px;
      height: 20px;
      position: relative;
      overflow: hidden;
      border: 1px solid #2d333f;
    }
    .timer-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b, #10b981);
      transition: width 0.15s linear;
    }
    .timer-txt {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
    }

    /* الرقعة الأصلية الثابتة */
    .arena {
      display: flex;
      gap: 6px;
      width: 100%;
      max-width: 420px;
    }
    .eval-bar-wrap {
      width: 16px;
      background: #27272a;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #3f3f46;
      position: relative;
    }
    .eval-black {
      background: #18181b;
      width: 100%;
      height: 50%;
      transition: height 0.3s;
    }
    .eval-white {
      background: #f4f4f5;
      width: 100%;
      flex: 1;
    }
    .eval-txt {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 9px;
      font-weight: bold;
      color: #10b981;
      background: rgba(0,0,0,0.8);
      padding: 1px 2px;
      border-radius: 3px;
    }

    .board-wrapper {
      flex: 1;
      position: relative;
      aspect-ratio: 1 / 1;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.7);
      background: #b58863;
    }
    #native-board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      height: 100%;
    }
    .sq {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }
    .sq.light { background-color: #f0d9b5; }
    .sq.dark { background-color: #b58863; }
    .sq.selected { background-color: #7fa650 !important; }
    .sq.last-move { background-color: rgba(245, 158, 11, 0.45) !important; }

    .sq img {
      width: 85%;
      height: 85%;
      pointer-events: none;
    }

    #arrow-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .legend {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 420px;
      margin-top: 6px;
      font-size: 11px;
      color: #9ca3af;
      padding: 0 4px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
      width: 100%;
      max-width: 420px;
    }
    button.btn-ctrl {
      padding: 11px 4px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
    }
    button.btn-ctrl:active { opacity: 0.75; }
    .btn-auto { background: #10b981; color: #042f1a !important; }
    .btn-flip { background: #2563eb; }
    .btn-undo { background: #374151; }
    .btn-new { background: #dc2626; }
  </style>
</head>
<body>

  <div class="top-bar">
    <button id="btn-side-w" class="btn-side active">⚪ أنا الأبيض</button>
    <button id="btn-side-b" class="btn-side">⚫ أنا الأسود</button>
    <select id="mode-select" class="mode-select">
      <option value="stealth">🕵️ مموّه (لا يُكشف)</option>
      <option value="killer">💀 سفاح خارق (100%)</option>
    </select>
  </div>

  <div class="hud-box">
    <div class="turn-row">
      <span id="turn-txt" class="my-turn">🎯 دورك الآن (الأبيض)</span>
      <span style="font-size:11px; color:#10b981;">⚡ النظام نشط</span>
    </div>
    <div class="advice-row">
      <span id="advice-txt">جاري فحص الرقعة...</span>
      <span id="badge-txt" class="badge">نقلة محترف</span>
    </div>
    <div class="timer-wrap">
      <div id="timer-bar" class="timer-bar"></div>
      <div id="timer-txt" class="timer-txt">⏱️ وقت التفكير المقترح</div>
    </div>
  </div>

  <div class="arena">
    <div class="eval-bar-wrap">
      <div id="eval-black" class="eval-black"></div>
      <div class="eval-white"></div>
      <div id="eval-txt" class="eval-txt">0.0</div>
    </div>

    <div class="board-wrapper">
      <div id="native-board"></div>
      <canvas id="arrow-canvas"></canvas>
    </div>
  </div>

  <div class="legend">
    <span><b style="color:#10b981;">━━►</b> النقلة الفائزة المموّهة</span>
    <span><b style="color:#3b82f6;">- - ►</b> النقلة الحاسوبية القاتلة</span>
  </div>

  <div class="controls">
    <button class="btn-ctrl btn-auto" id="btn-auto">⚡ العب
